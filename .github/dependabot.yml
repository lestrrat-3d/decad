version: 2
updates:
  # The workflows pin every action to a full commit SHA, so an update is only
  # visible to Dependabot — never to a floating tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # codeql-action ships its steps as separate sub-action paths (init,
    # autobuild, analyze) that share a single release SHA. Ungrouped, one
    # release lands as three PRs editing adjacent lines of the same workflow.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  # _gallery is its own Go module (see its go.mod), kept out of the root module
  # so the README image renderer never becomes a library dependency. A
  # directory: / entry does not reach it, so it needs its own entry or its
  # pins would stay frozen forever.
  - package-ecosystem: gomod
    directory: /_gallery
    schedule:
      interval: weekly
