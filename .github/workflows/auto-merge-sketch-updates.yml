name: Auto-merge Sketch module updates

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.title, 'Bump github.com/lestrrat-3d/sketch ')
    runs-on: ubuntu-latest
    steps:
      - name: Queue the root-module update after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files=$(gh pr view "$PR_URL" --json files --jq '.files[].path')
          if [ -z "$files" ]; then
            echo 'The dependency update has no changed files.' >&2
            exit 1
          fi

          while IFS= read -r file; do
            case "$file" in
              go.mod|go.sum) ;;
              *)
                echo "Leaving non-root module update for review: $file"
                exit 0
                ;;
            esac
          done <<< "$files"

          gh pr merge --auto --squash "$PR_URL"
