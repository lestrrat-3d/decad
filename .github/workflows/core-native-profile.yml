name: Core native profile

on:
  push:
    branches: [fix-windows-core-performance]

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Profile the real thread model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors |
            Format-List | Out-File .tmp/runner.txt
          go version | Out-File -Append .tmp/runner.txt
          go env GOARCH GOOS GOMAXPROCS | Out-File -Append .tmp/runner.txt
          go test ./apitest -run '^TestThreadExternalRod$' -count=1 -v `
            -cpuprofile=.tmp/thread.cpu -memprofile=.tmp/thread.mem `
            -o .tmp/apitest.test.exe 2>&1 | Tee-Object -FilePath .tmp/thread.log
          exit $LASTEXITCODE
      - name: Upload the native profiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-thread-profile
          include-hidden-files: true
          path: |
            .tmp/runner.txt
            .tmp/thread.log
            .tmp/thread.cpu
            .tmp/thread.mem
