name: Core native profile

on:
  push:
    branches: [fix-windows-core-performance]

permissions:
  contents: read

jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Profile the real API workload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          $profileDir = (Resolve-Path .tmp).Path
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors |
            Format-List | Out-File .tmp/runner.txt
          go version | Out-File -Append .tmp/runner.txt
          go env GOARCH GOOS GOMAXPROCS | Out-File -Append .tmp/runner.txt
          $testArgs = @(
            'test', './apitest', '-count=1', '-v', '-timeout=12m',
            "-cpuprofile=$profileDir/api.cpu", "-memprofile=$profileDir/api.mem",
            '-o', "$profileDir/apitest.test.exe"
          )
          & go @testArgs 2>&1 | Tee-Object -FilePath .tmp/api.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "$profileDir/api.cpu", "$profileDir/api.mem" |
            ForEach-Object {
              if ($_.Length -eq 0) { throw "Empty profile: $($_.FullName)" }
            }
      - name: Upload the native profiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-api-profile
          include-hidden-files: true
          path: |
            .tmp/runner.txt
            .tmp/api.log
            .tmp/api.cpu
            .tmp/api.mem
