name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows to run this whole pipeline as a gate before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint and test jobs run independently. The race shards share the two test
  # binaries race-binary builds: the root package's and apitest's.
  #
  # Each Linux job that compiles keeps its own Go build cache through
  # .github/actions/go-build-cache-restore and go-build-cache-save, so it
  # restores what it built itself; those actions explain the key and the
  # save policy. setup-go's own cache is off in those jobs. It keys on the OS
  # and go.sum alone, so every Linux job would share one entry, saved by
  # whichever job finished first. verify, gallery, macOS and Windows each
  # still use setup-go's cache, since each is the only job with its key.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The linted packages change in nearly every pull request, so this key
      # covers go.mod and go.sum alone, and the snapshot is reused for the
      # standard library and the dependencies.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # apitest holds the root package's tests that use only the exported API. Its
  # test binary compiles against the root package alone, so go builds it beside
  # the root test binary instead of after it.
  race-binary:
    name: Build race test binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The sources are every package the two test binaries compile: the root
      # package, apitest/, and everything outside dynamics/ and examples/. A
      # pull request that changes none of them restores both binaries, links
      # included.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-binary
          sources: |
            :(glob)**/*.go
            :(exclude)dynamics
            :(exclude)examples
            :(exclude)_gallery
            :(exclude)_shardgen

      - name: Download dependencies
        run: go mod download

      # With an -o directory and two packages, go test -c writes
      # race-bin/decad.test and race-bin/apitest.test.
      - name: Build race test binaries
        run: go test -c -race -o race-bin/ . ./apitest/

      - name: Upload race test binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: race-tests
          path: race-bin/
          if-no-files-found: error
          retention-days: 1

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # Every shard runner runs its shard of both race binaries.
  test-root-race:
    name: test (${{ matrix.os }}, ${{ matrix.race }}, ${{ matrix.shard }})
    needs: [race-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: "0"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "1"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "2"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "3"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "4"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "5"
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download race test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: race-tests
          path: race-bin

      # Each shard regex is derived from ONE binary's own names, so it is
      # applied to that binary alone. A -run filter built from one package's
      # names matches nothing in another, so handing it ./... would run zero
      # tests in every other package while still reporting success. -run gates
      # Examples and Fuzz seed corpora as well as Test functions, so the
      # enumeration takes all three.
      #
      # Which shard a test belongs to is READ from its binary's assignment file
      # (.github/test-shards.txt for the root package,
      # .github/test-shards-apitest.txt for apitest), not computed from its
      # position in the enumeration. A positional split moves half the suite
      # between shards whenever a test is added, so a balance that held
      # yesterday is re-rolled by the next commit; the recorded assignment is
      # packed by measured cost and moves nothing when the suite grows.
      # ci_workflow_test.go and apitest/ci_shards_test.go fail when a test on
      # disk is in no shard.
      #
      # run_shard runs a binary from its package directory, as go test does,
      # so a test reading a path relative to its package finds it.
      - name: Run race tests (Ubuntu shard)
        shell: bash
        run: |
          run_shard() {
            local bin="$GITHUB_WORKSPACE/race-bin/$1" shards="$2" dir="$3"
            chmod +x "$bin"
            local tests
            tests="$("$bin" -test.list '.*' | awk -v shard='${{ matrix.shard }}' '
              NR == FNR {
                if ($0 !~ /^#/ && NF == 3) {
                  pin[$3] = $1
                }
                next
              }
              /^(Test|Fuzz|Example)/ {
                if ($0 in pin && pin[$0] == shard) {
                  printf "%s|", $0
                }
              }
            ' "$shards" -)"
            tests="${tests%|}"
            test -n "$tests"
            (cd "$dir" && "$bin" -test.timeout 10m -test.run "^(${tests})$")
          }
          start=$SECONDS
          run_shard decad.test .github/test-shards.txt .
          run_shard apitest.test .github/test-shards-apitest.txt apitest
          elapsed=$(( SECONDS - start ))
          echo "shard ${{ matrix.shard }} finished in ${elapsed}s"
          # A soft budget, far below the -timeout above. The suite runs its tests
          # in parallel, so a balanced shard finishes in a small fraction of this;
          # crossing it means the recorded costs have drifted, and it says so HERE
          # rather than months later when a shard finally hits the ceiling and
          # fails as if a test had hung. Re-measure and regenerate the assignment;
          # _shardgen/main.go carries the command.
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::shard ${{ matrix.shard }} took ${elapsed}s, over the 300s budget; re-measure and regenerate .github/test-shards.txt and .github/test-shards-apitest.txt (see _shardgen/main.go)"
            exit 1
          fi

  # The packages outside the root run on two Ubuntu runners. macOS and Windows
  # run the whole suite without the race detector.
  #
  # ./dynamics/ has a runner of its own. Its scenes run one after another, and
  # their time under -race depends on the hardware the job lands on: the same
  # tests take about twice as long on the slowest ubuntu-latest runners as on
  # the fastest. The 30m -timeout covers the slowest runner with room for more
  # scenes. The 600s soft budget (`budget:`) sits far below it, so growth in
  # the scenes is reported long before the timeout would fail the job.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: ""
            packages: "./examples/ ./decadtest/ ./export/ ./internal/proof/ ./internal/pair/ ./internal/tessellation/ ./internal/proofbound/ ./internal/decaderr/"
            timeout: "10m"
          - os: ubuntu-latest
            race: "-race"
            shard: ""
            packages: "./dynamics/"
            timeout: "30m"
            budget: "600"
          - os: macos-latest
            race: ""
            shard: ""
            packages: ""
          - os: windows-latest
            race: ""
            shard: ""
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macOS and Windows keep setup-go's cache: each is the only job with its
      # key, so the entry it saves holds its own build.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.os != 'Linux' }}

      # Both Linux runners compile the root package, which changes in nearly
      # every pull request, so their keys cover go.mod and go.sum alone. The
      # cache name comes from the existing matrix fields, so the job names stay
      # as they are.
      - name: Restore Go build cache
        if: runner.os == 'Linux'
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-${{ matrix.packages == './dynamics/' && 'dynamics' || 'packages' }}

      - name: Download dependencies
        run: go mod download

      # The CPU model and count tell which speed group of ubuntu-latest runner
      # the dynamics job landed on, which its wall time depends on.
      - name: Describe the runner CPU
        if: matrix.packages == './dynamics/'
        run: |
          nproc
          lscpu

      # Every package outside the root, apart from apitest/, runs UNFILTERED on
      # one runner, so these runners and the race shards together cover what an
      # unsharded `go test ./...` covers. ci_workflow_test.go fails when a
      # package on disk is named by no runner.
      # -v prints each test's duration, so a slow run shows which tests grew.
      # A runner with a `budget:` fails once the run takes longer than that
      # many seconds, far below its -timeout; see the comment above the matrix.
      # The restored build cache also holds test results, and go test replays
      # a stored result instead of running the test when nothing it depends on
      # changed. -count=1 makes every test run, so the cache saves compile
      # time only.
      - name: Run tests outside the root package (Ubuntu shard)
        if: matrix.packages != ''
        shell: bash
        run: |
          start=$SECONDS
          go test ${{ matrix.race }} -count=1 -v -timeout ${{ matrix.timeout }} ${{ matrix.packages }}
          elapsed=$(( SECONDS - start ))
          echo "${{ matrix.packages }} finished in ${elapsed}s"
          budget='${{ matrix.budget }}'
          if [ -n "$budget" ] && [ "$elapsed" -gt "$budget" ]; then
            echo "::error::${{ matrix.packages }} took ${elapsed}s, over the ${budget}s budget; find the tests that grew in the -v durations above"
            exit 1
          fi

      # The whole-suite run is the non-Linux leg: no shard, and no package
      # operand of its own. The examples runner has a `packages:` operand, so
      # this must test BOTH fields or it would re-run the entire suite there.
      - name: Run tests
        if: matrix.shard == '' && matrix.packages == ''
        run: go test ${{ matrix.race }} -timeout 10m ./...

      - name: Save Go build cache
        if: runner.os == 'Linux'
        uses: ./.github/actions/go-build-cache-save

  # Verify the tree is tidy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # _gallery is its own module, so no ./... above reaches it. Its go.mod
  # replaces decad with this checkout, so a root change that breaks the README
  # renderer or the landing clip fails here.
  gallery:
    name: gallery (README images and landing clip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _gallery
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: _gallery/go.mod
          cache-dependency-path: _gallery/go.sum

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # These commands run in _gallery, not over the root suite the shard jobs
      # own.
      # The tumble scene's 768 steps and the parts-bin scene's 1024 take
      # about six and four minutes on a fast machine, together past go test's
      # default ten-minute budget, and about twice that on a slow runner.
      - name: Vet and test
        run: |
          go vet ./...
          go test -timeout 45m ./...

      # -smoke renders the first frame of every shot. -probe builds and
      # tessellates the bodies of every frame, so it also catches decad
      # refusing a value partway through a parameter ramp.
      - name: Smoke-render hero and dynamics scenes and probe the landing clip
        run: |
          go run . hero -smoke -out "$RUNNER_TEMP/hero"
          go run . clip -smoke -out "$RUNNER_TEMP/frames"
          go run . clip -probe
          go run . dynamics -scene stack-and-drop -smoke -out "$RUNNER_TEMP/dynamics"
          go run . dynamics -scene tumble -smoke -out "$RUNNER_TEMP/dynamics"
          go run . dynamics -scene parts-bin -smoke -out "$RUNNER_TEMP/dynamics"

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: v1.4.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The cache name carries the govulncheck version, so a version bump saves
      # a snapshot holding the new build of the tool.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: govulncheck-${{ env.GOVULNCHECK_VERSION }}

      # govulncheck requires a newer Go than this module's `go` directive, but
      # setup-go pins GOTOOLCHAIN=local. Allow an on-demand toolchain fetch so
      # the tool builds; it still analyzes this module as authored.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save
