name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows to run this whole pipeline as a gate before publishing.
  workflow_call:
  # The dependent-module sync workflow dispatches CI on its updated PR head.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs: a newer push cancels the older run. main runs: the running one finishes, and only the newest waiting run is kept.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The binary builder supplies root/API shards and tiny dependent packages.
  # Examples, internal packages, dynamics, lint and verification start independently.
  # Linux compile jobs use separate build-cache entries per workload.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The linted packages change in nearly every pull request, so this key
      # covers go.mod and go.sum alone, and the snapshot is reused for the
      # standard library and the dependencies.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # apitest holds the root package's tests that use only the exported API. Its
  # test binary compiles against the root package alone, so go builds it beside
  # the root test binary instead of after it.
  race-binary:
    name: Build race test binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The sources are every package the test binaries compile: the root
      # package, apitest/, and their dependencies outside dynamics/. A pull
      # request that changes none of them restores every binary, links
      # included.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-binary
          sources: |
            :(glob)**/*.go
            :(exclude)dynamics
            :(exclude)examples
            :(exclude)_gallery
            :(exclude)_shardgen

      - name: Download dependencies
        run: go mod download

      # The shards need only the root and exported-API test binaries.
      - name: Build race test binaries
        run: go test -c -race -o race-bin/ . ./apitest/

      # Shards download the two binaries with recorded name assignments.
      - name: Upload race test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-tests
          path: |
            race-bin/decad.test
            race-bin/apitest.test
          if-no-files-found: error
          retention-days: 1

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # These support packages run independently while the root/API binaries build.
  test-support-packages:
    name: test (ubuntu-latest, support packages, -race)
    runs-on: ubuntu-latest
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-support-packages
          sources: |
            :(glob)**/*.go
            :(exclude)dynamics
            :(exclude)examples
            :(exclude)_gallery
            :(exclude)_shardgen

      - name: Download dependencies
        run: go mod download

      - name: Run support package race tests
        run: go test -race -count=1 -v -timeout 10m ./decadtest/ ./export/ ./internal/decaderr/

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # Root/API tests still need measured test-name shards to bound execution.
  test-root-race:
    name: test (${{ matrix.os }}, ${{ matrix.race }}, ${{ matrix.shard }})
    needs: [race-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: "0"
            packages: "./decadtest/ ./export/ ./internal/decaderr/"
          - os: ubuntu-latest
            race: "-race"
            shard: "1"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "2"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "3"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "4"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "5"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "6"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "7"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "8"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "9"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "10"
            packages: ""
    runs-on: ${{ matrix.os }}
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Timing comparisons must be made within one CPU class, so every test
      # job records its runner CPU on one greppable line.
      - name: Describe the runner CPU
        if: runner.os == 'Linux'
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          if [ -n "$model" ]; then
            echo "runner-cpu: ${model} x$(nproc)"
          else
            echo "runner-cpu: unknown"
          fi

      - name: Download race test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: race-tests
          path: race-bin

      # Each shard regex is derived from ONE binary's own names, so it is
      # applied to that binary alone. A -run filter built from one package's
      # names matches nothing in another, so handing it ./... would run zero
      # tests in every other package while still reporting success. -run gates
      # Examples and Fuzz seed corpora as well as Test functions, so the
      # enumeration takes all three.
      #
      # Root and apitest read their own .github/test-shards*.txt assignment.
      # Assignments are not computed from a test's
      # position in the enumeration. A positional split moves half the suite
      # between shards whenever a test is added, so a balance that held
      # yesterday is re-rolled by the next commit; the recorded assignment is
      # packed by measured cost and moves nothing when the suite grows.
      # Each sharded package's CI guard fails when a name on disk has no shard.
      #
      # run_shard runs a binary from its package directory, as go test does,
      # so a test reading a path relative to its package finds it. Both
      # binaries run at the same time, each in a background subshell writing
      # to its own log, because each keeps only about 1.5 of the runner's
      # four cores busy. The step waits for both, prints each log whole under
      # its own group so the output is not interleaved, and fails when either
      # binary failed. A shard whose regex selects no test for a binary fails
      # in that binary's subshell, as it does when run alone.
      - name: Run race tests (Ubuntu shard)
        shell: bash
        run: |
          timeout=10m
          budget=240
          run_shard() {
            local bin="$GITHUB_WORKSPACE/race-bin/$1" shards="$2" dir="$3"
            chmod +x "$bin"
            local tests
            tests="$("$bin" -test.list '.*' | awk -v shard='${{ matrix.shard }}' '
              NR == FNR {
                if ($0 !~ /^#/ && NF == 3) {
                  pin[$3] = $1
                }
                next
              }
              /^(Test|Fuzz|Example)/ {
                if ($0 in pin && pin[$0] == shard) {
                  printf "%s|", $0
                }
              }
            ' "$shards" -)"
            tests="${tests%|}"
            test -n "$tests"
            (cd "$dir" && "$bin" -test.v -test.timeout "$timeout" -test.run "^(${tests})$")
          }
          start=$SECONDS
          logdir="$(mktemp -d)"
          (
            run_shard decad.test .github/test-shards.txt .
          ) >"$logdir/decad.log" 2>&1 &
          decad_pid=$!
          (
            run_shard apitest.test .github/test-shards-apitest.txt apitest
          ) >"$logdir/apitest.log" 2>&1 &
          apitest_pid=$!
          decad_rc=0
          apitest_rc=0
          wait "$decad_pid" || decad_rc=$?
          wait "$apitest_pid" || apitest_rc=$?
          echo "::group::decad.test"
          cat "$logdir/decad.log"
          echo "::endgroup::"
          echo "::group::apitest.test"
          cat "$logdir/apitest.log"
          echo "::endgroup::"
          if [ "$decad_rc" -ne 0 ] || [ "$apitest_rc" -ne 0 ]; then
            echo "::error::shard ${{ matrix.shard }} failed: decad.test exit ${decad_rc}, apitest.test exit ${apitest_rc}"
            exit 1
          fi
          elapsed=$(( SECONDS - start ))
          echo "shard ${{ matrix.shard }} finished in ${elapsed}s"
          # This measures execution, not runner queue or artifact-build time.
          # Re-measure and regenerate when costs drift.
          if [ "$elapsed" -gt "$budget" ]; then
            echo "::error::shard ${{ matrix.shard }} took ${elapsed}s, over the ${budget}s budget; re-measure and regenerate .github/test-shards.txt and the companion manifests (see _shardgen/main.go)"
            exit 1
          fi

  # Go runs these ordinary packages concurrently, with no test-name filters.
  # A dedicated cache keeps the examples' build output between runs.
  test-examples:
    name: examples (-race)
    runs-on: ubuntu-latest
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-examples

      - name: Download dependencies
        run: go mod download

      - name: Run whole example packages
        run: go test -race -count=1 -v -timeout 10m ./examples/...

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # These arithmetic tests do not import the root package, so they compile
  # independently of the root race binaries.
  test-arithmetic:
    name: test (ubuntu-latest, -race, arithmetic)
    runs-on: ubuntu-latest
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Describe the runner CPU
        run: |
          model=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p')
          printf 'runner-cpu: %s x%s\n' "$model" "$(nproc)"

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-arithmetic
          sources: |
            :(glob)internal/**/*.go
            :(glob)report/*.go

      - name: Download dependencies
        run: go mod download

      - name: Run arithmetic race tests
        run: go test -race -count=1 -v -timeout 10m ./internal/proof/ ./internal/proofbound/

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # Keep the longest internal packages on separate runners. The general
  # runner discovers all other internal packages, including newly added ones.
  # Internal jobs compile without the root package; dynamics builds it itself.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            group: packages
            race: "-race"
            shard: ""
            packages: "./report/ ./linkage/ ./internal/..."
            timeout: "10m"
          - os: ubuntu-latest
            group: meshbool
            race: "-race"
            shard: ""
            packages: "./internal/meshbool/"
            timeout: "10m"
          - os: ubuntu-latest
            group: loft
            race: "-race"
            shard: ""
            packages: "./internal/loftmesh/ ./internal/loftcylinder/ ./internal/crossbore/"
            timeout: "10m"
          - os: ubuntu-latest
            group: dynamics
            race: "-race"
            shard: ""
            packages: "./dynamics/"
            timeout: "30m"
            budget: "600"
    runs-on: ${{ matrix.os }}
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Timing comparisons must be made within one CPU class, so every test
      # job records its runner CPU on one greppable line.
      - name: Describe the runner CPU
        if: runner.os == 'Linux'
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          if [ -n "$model" ]; then
            echo "runner-cpu: ${model} x$(nproc)"
          else
            echo "runner-cpu: unknown"
          fi

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Each workload restores its own compile cache. Source changes are
      # checked by Go; the cache key covers the module's dependencies.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-${{ matrix.group }}

      - name: Download dependencies
        run: go mod download

      - name: Build dynamics race test binary
        if: matrix.packages == './dynamics/'
        shell: bash
        run: |
          date +%s > dynamics-start.txt
          go test -c -race -o dynamics.test ./dynamics/

      - name: Run dynamics race tests
        if: matrix.packages == './dynamics/'
        shell: bash
        run: |
          (cd dynamics && ../dynamics.test -test.count=1 -test.v -test.timeout '${{ matrix.timeout }}')
          elapsed=$(( $(date +%s) - $(cat dynamics-start.txt) ))
          echo "./dynamics/ finished in ${elapsed}s"
          budget='${{ matrix.budget }}'
          if [ -n "$budget" ] && [ "$elapsed" -gt "$budget" ]; then
            echo "::error::./dynamics/ took ${elapsed}s, over the ${budget}s budget; find the tests that grew in the -v durations above"
            exit 1
          fi

      - name: Run dedicated internal race tests
        if: matrix.group == 'meshbool' || matrix.group == 'loft'
        run: go test -race -count=1 -v -timeout 10m ${{ matrix.packages }}

      # The exclusions have dedicated unfiltered runners above. Three purely
      # sequential arithmetic packages keep their existing non-race coverage.
      - name: Run tests outside the root package (Ubuntu shard)
        if: matrix.group == 'packages'
        shell: bash
        run: |
          mod="$(go list -m)"
          norace_re="${mod}/internal/(loftface|polynomial|linkagebound)"
          arithmetic_re="${mod}/internal/(proof|proofbound)"
          dedicated_re="${mod}/internal/(meshbool|loftmesh|loftcylinder|crossbore|decaderr)"
          norace="$(go list ${{ matrix.packages }} | grep -x -E "$norace_re")"
          rest="$(go list ${{ matrix.packages }} | grep -v -x -E "$norace_re|$dedicated_re|$arithmetic_re")"
          test -n "$rest"
          test -n "$norace"
          go test -race -count=1 -v -timeout 10m $rest
          go test -count=1 -v -timeout 10m $norace

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # The platform check names match the former macOS and Windows matrix legs.
  test-platforms:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            race: ""
            shard: ""
            packages: ""
          - os: windows-latest
            race: ""
            shard: ""
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # The whole-suite runner has no shard or package operand. Check both so
      # a future matrix change cannot make it repeat the Linux package tests.
      - name: Run tests
        if: matrix.shard == '' && matrix.packages == ''
        run: go test ${{ matrix.race }} -timeout 30m ./...

  # Verify the tree is tidy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # _gallery is its own module, so no ./... above reaches it. Its go.mod
  # replaces decad with this checkout, so a root change that breaks the README
  # renderer or the landing clip fails here.
  gallery:
    name: gallery (README images and landing clip)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _gallery
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Timing comparisons must be made within one CPU class, so every test
      # job records its runner CPU on one greppable line.
      - name: Describe the runner CPU
        if: runner.os == 'Linux'
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          if [ -n "$model" ]; then
            echo "runner-cpu: ${model} x$(nproc)"
          else
            echo "runner-cpu: unknown"
          fi

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: _gallery/go.mod
          cache: false

      # setup-go's cache would key this job on _gallery/go.sum alone, so its
      # one entry would keep the decad packages as they were when that file
      # last changed. The sources are every package the gallery compiles:
      # the root package, dynamics/, internal/ and _gallery/ itself. The
      # restore action runs from the repository root, so the paths start
      # there.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: gallery
          sources: |
            :(glob)**/*.go
            :(exclude)apitest
            :(exclude)decadtest
            :(exclude)examples
            :(exclude)export
            :(exclude)_shardgen
            _gallery/go.mod
            _gallery/go.sum

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # These commands run in _gallery, not over the root suite the shard jobs
      # own.
      # The tumble scene's 768 steps and the parts-bin scene's 1024 take
      # about six and four minutes on a fast machine, together past go test's
      # default ten-minute budget, and about twice that on a slow runner.
      # The scenes' tests run in parallel, one timeline per core, so the
      # step takes about as long as the slowest scene.
      - name: Vet and test
        run: |
          go vet ./...
          go test -timeout 45m ./...

      # -smoke renders the first frame of every shot. -probe builds and
      # tessellates the bodies of every frame, so it also catches decad
      # refusing a value partway through a parameter ramp.
      #
      # The dynamics subcommand runs one scene, stack-and-drop, the shortest.
      # Its path through flag parsing, the scene map, the clip and the PNG
      # sequence is the same for every scene. The tests above advance every
      # scene's whole timeline once, built through the same scene map, and
      # render its first frame at the smoke size, so a smoke render of the
      # tumble or parts-bin scene would advance its timeline a second time
      # and check nothing more.
      - name: Smoke-render hero and dynamics scenes and probe the landing clip
        run: |
          go run . hero -smoke -out "$RUNNER_TEMP/hero"
          go run . clip -smoke -out "$RUNNER_TEMP/frames"
          go run . clip -probe
          go run . dynamics -scene stack-and-drop -smoke -out "$RUNNER_TEMP/dynamics"

      - name: Render the complete thread example
        run: go run . -only thread -scale 0.125 -out "$RUNNER_TEMP/thread"

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: v1.9.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The cache name carries the govulncheck version, so a version bump saves
      # a snapshot holding the new build of the tool.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: govulncheck-${{ env.GOVULNCHECK_VERSION }}

      # govulncheck requires a newer Go than this module's `go` directive, but
      # setup-go pins GOTOOLCHAIN=local. Allow an on-demand toolchain fetch so
      # the tool builds; it still analyzes this module as authored.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save
