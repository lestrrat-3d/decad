name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows to run this whole pipeline as a gate before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  # Tier 1: lint runs first. The heavier tiers below gate on it via `needs`,
  # so a lint failure short-circuits the pipeline before any tests run.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  # Tier 2: tests, only after lint succeeds. Race detector on Linux; the other
  # OSes run the same suite without it, purely for cross-platform coverage.
  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: "0"
            packages: "./examples/"
          - os: ubuntu-latest
            race: "-race"
            shard: "1"
            packages: ""
          - os: macos-latest
            race: ""
            shard: ""
            packages: ""
          - os: windows-latest
            race: ""
            shard: ""
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # The shard regex is derived from the ROOT package's own names, so it is
      # applied to the ROOT package alone. A -run filter built from one
      # package's names matches nothing in another, so handing it ./... would
      # run zero tests in every other package while still reporting success.
      # -run gates Examples and Fuzz seed corpora as well as Test functions,
      # so the enumeration takes all three.
      - name: Run root-package tests (Ubuntu shard)
        if: matrix.shard != ''
        shell: bash
        run: |
          tests="$(go test -list '.*' . | awk -v shard='${{ matrix.shard }}' '
            /^(Test|Fuzz|Example)/ {
              if (count % 2 == shard) {
                printf "%s|", $0
              }
              count++
            }
          ')"
          tests="${tests%|}"
          test -n "$tests"
          go test ${{ matrix.race }} -timeout 10m -run "^(${tests})$" .

      # Every package outside the root runs UNFILTERED on one shard, so the
      # shards together cover what an unsharded `go test ./...` covers.
      # ci_workflow_test.go fails when a package on disk is named by no shard.
      - name: Run tests outside the root package (Ubuntu shard)
        if: matrix.packages != ''
        shell: bash
        run: go test ${{ matrix.race }} -timeout 10m ${{ matrix.packages }}

      - name: Run tests
        if: matrix.shard == ''
        run: go test ${{ matrix.race }} -timeout 10m ./...

  # Tier 2: verify the tree is tidy.
  verify:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Tier 2: vulnerability scan of the module and its dependencies.
  govulncheck:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # govulncheck requires a newer Go than this module's `go` directive, but
      # setup-go pins GOTOOLCHAIN=local. Allow an on-demand toolchain fetch so
      # the tool builds; it still analyzes this module as authored.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
