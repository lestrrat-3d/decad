name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows to run this whole pipeline as a gate before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  # Lint and test jobs run independently. The root race shards share one test
  # binary built by race-binary.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

  race-binary:
    name: Build root race test binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build root race test binary
        run: go test -c -race -o decad.race.test .

      - name: Upload root race test binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decad-race-test
          path: decad.race.test
          if-no-files-found: error
          retention-days: 1

  # The root package uses one compiled race binary across its shards.
  test-root-race:
    name: test (${{ matrix.os }}, ${{ matrix.race }}, ${{ matrix.shard }})
    needs: [race-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: "0"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "1"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "2"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "3"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "4"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "5"
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download root race test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: decad-race-test
          path: .

      # The shard regex is derived from the ROOT package's own names, so it is
      # applied to the ROOT package alone. A -run filter built from one
      # package's names matches nothing in another, so handing it ./... would
      # run zero tests in every other package while still reporting success.
      # -run gates Examples and Fuzz seed corpora as well as Test functions,
      # so the enumeration takes all three.
      #
      # Which shard a test belongs to is READ from .github/test-shards.txt, not
      # computed from its position in the enumeration. A positional split moves
      # half the suite between shards whenever a test is added, so a balance that
      # held yesterday is re-rolled by the next commit; the recorded assignment
      # is packed by measured cost and moves nothing when the suite grows.
      # ci_workflow_test.go fails when a test on disk is in no shard.
      - name: Run root-package tests (Ubuntu shard)
        shell: bash
        run: |
          chmod +x decad.race.test
          tests="$(./decad.race.test -test.list '.*' | awk -v shard='${{ matrix.shard }}' '
            NR == FNR {
              if ($0 !~ /^#/ && NF == 3) {
                pin[$3] = $1
              }
              next
            }
            /^(Test|Fuzz|Example)/ {
              if ($0 in pin && pin[$0] == shard) {
                printf "%s|", $0
              }
            }
          ' .github/test-shards.txt -)"
          tests="${tests%|}"
          test -n "$tests"
          start=$SECONDS
          ./decad.race.test -test.timeout 10m -test.run "^(${tests})$"
          elapsed=$(( SECONDS - start ))
          echo "shard ${{ matrix.shard }} finished in ${elapsed}s"
          # A soft budget, far below the -timeout above. The suite runs its tests
          # in parallel, so a balanced shard finishes in a small fraction of this;
          # crossing it means the recorded costs have drifted, and it says so HERE
          # rather than months later when a shard finally hits the ceiling and
          # fails as if a test had hung. Re-measure and regenerate the assignment;
          # _shardgen/main.go carries the command.
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::shard ${{ matrix.shard }} took ${elapsed}s, over the 300s budget; re-measure and regenerate .github/test-shards.txt (see _shardgen/main.go)"
            exit 1
          fi

  # The packages outside the root run on two Ubuntu runners. macOS and Windows
  # run the whole suite without the race detector.
  #
  # ./dynamics/ has a runner of its own. Its scenes run one after another, and
  # their time under -race depends on the hardware the job lands on: the same
  # tests take about twice as long on the slowest ubuntu-latest runners as on
  # the fastest. The 30m -timeout covers the slowest runner with room for more
  # scenes. The 600s soft budget (`budget:`) sits far below it, so growth in
  # the scenes is reported long before the timeout would fail the job.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: ""
            packages: "./examples/ ./decadtest/ ./export/ ./internal/proof/ ./internal/pair/ ./internal/tessellation/"
            timeout: "10m"
          - os: ubuntu-latest
            race: "-race"
            shard: ""
            packages: "./dynamics/"
            timeout: "30m"
            budget: "600"
            gogc: "400"
          - os: macos-latest
            race: ""
            shard: ""
            packages: ""
          - os: windows-latest
            race: ""
            shard: ""
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # The CPU model and count tell which speed group of ubuntu-latest runner
      # the dynamics job landed on, which its wall time depends on.
      - name: Describe the runner CPU
        if: matrix.packages == './dynamics/'
        run: |
          nproc
          lscpu

      # Every package outside the root runs UNFILTERED on one shard, so the
      # shards together cover what an unsharded `go test ./...` covers.
      # ci_workflow_test.go fails when a package on disk is named by no shard.
      # -v prints each test's duration, so a slow run shows which tests grew.
      # A runner with a `budget:` fails once the run takes longer than that
      # many seconds, far below its -timeout; see the comment above the matrix.
      # A matrix entry with `gogc:` runs its tests with that GOGC. The dynamics
      # scenes allocate heavily, so a larger GC target cuts wall time. It is
      # set here and not in a test main so local runs keep the default heap
      # growth and their memory use. An empty value leaves GOGC at its default.
      - name: Run tests outside the root package (Ubuntu shard)
        if: matrix.packages != ''
        shell: bash
        env:
          GOGC: ${{ matrix.gogc }}
        run: |
          start=$SECONDS
          go test ${{ matrix.race }} -v -timeout ${{ matrix.timeout }} ${{ matrix.packages }}
          elapsed=$(( SECONDS - start ))
          echo "${{ matrix.packages }} finished in ${elapsed}s"
          budget='${{ matrix.budget }}'
          if [ -n "$budget" ] && [ "$elapsed" -gt "$budget" ]; then
            echo "::error::${{ matrix.packages }} took ${elapsed}s, over the ${budget}s budget; find the tests that grew in the -v durations above"
            exit 1
          fi

      # The whole-suite run is the non-Linux leg: no shard, and no package
      # operand of its own. The examples runner has a `packages:` operand, so
      # this must test BOTH fields or it would re-run the entire suite there.
      - name: Run tests
        if: matrix.shard == '' && matrix.packages == ''
        run: go test ${{ matrix.race }} -timeout 10m ./...

  # Verify the tree is tidy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # _gallery is its own module, so no ./... above reaches it. Its go.mod
  # replaces decad with this checkout, so a root change that breaks the README
  # renderer or the landing clip fails here.
  gallery:
    name: gallery (README images and landing clip)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _gallery
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: _gallery/go.mod
          cache-dependency-path: _gallery/go.sum

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # These commands run in _gallery, not over the root suite the shard jobs
      # own.
      # The tumble scene's 768 steps and the parts-bin scene's 1024 take
      # about six and four minutes on a fast machine, together past go test's
      # default ten-minute budget, and about twice that on a slow runner.
      # GOGC=400 is for the test step only: about 43% of its CPU samples are
      # garbage collection. It is set here and not in a test main so local
      # runs keep the default heap growth and their memory use.
      - name: Vet and test
        env:
          GOGC: "400"
        run: |
          go vet ./...
          go test -timeout 45m ./...

      # -smoke renders the first frame of every shot. -probe builds and
      # tessellates the bodies of every frame, so it also catches decad
      # refusing a value partway through a parameter ramp.
      - name: Smoke-render hero and dynamics scenes and probe the landing clip
        run: |
          go run . hero -smoke -out "$RUNNER_TEMP/hero"
          go run . clip -smoke -out "$RUNNER_TEMP/frames"
          go run . clip -probe
          go run . dynamics -scene stack-and-drop -smoke -out "$RUNNER_TEMP/dynamics"
          go run . dynamics -scene tumble -smoke -out "$RUNNER_TEMP/dynamics"
          go run . dynamics -scene parts-bin -smoke -out "$RUNNER_TEMP/dynamics"

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # govulncheck requires a newer Go than this module's `go` directive, but
      # setup-go pins GOTOOLCHAIN=local. Allow an on-demand toolchain fetch so
      # the tool builds; it still analyzes this module as authored.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
