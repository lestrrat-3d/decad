name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow other workflows to run this whole pipeline as a gate before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR runs: a newer push cancels the older run. main runs: the running one finishes, and only the newest waiting run is kept.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint and test jobs run independently. The race shards share the two test
  # binaries race-binary builds: the root package's and apitest's. The job
  # that runs the packages outside the root also takes the binaries of the four
  # packages whose tests import the root package, so it compiles the root
  # package under -race zero times.
  #
  # Each Linux job that compiles keeps its own Go build cache through
  # .github/actions/go-build-cache-restore and go-build-cache-save, so it
  # restores what it built itself; those actions explain the key and the
  # save policy. setup-go's own cache is off in those jobs. It keys on the OS
  # and go.sum alone, so every Linux job would share one entry, saved by
  # whichever job finished first. verify, macOS and Windows each still use
  # setup-go's cache, since each is the only job with its key.
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The linted packages change in nearly every pull request, so this key
      # covers go.mod and go.sum alone, and the snapshot is reused for the
      # standard library and the dependencies.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # apitest holds the root package's tests that use only the exported API. Its
  # test binary compiles against the root package alone, so go builds it beside
  # the root test binary instead of after it.
  race-binary:
    name: Build race test binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The sources are every package the test binaries compile: the root
      # package, apitest/, examples/, and everything outside dynamics/. A pull
      # request that changes none of them restores every binary, links
      # included.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-binary
          sources: |
            :(glob)**/*.go
            :(exclude)dynamics
            :(exclude)_gallery
            :(exclude)_shardgen

      - name: Download dependencies
        run: go mod download

      # With an -o directory, go test -c writes one <package>.test per package:
      # race-bin/decad.test, apitest.test, examples.test, decadtest.test,
      # export.test and decaderr.test. The last four are the packages outside
      # the root whose tests import it; the job that runs them below needs no
      # root compile of its own.
      - name: Build race test binaries
        run: go test -c -race -o race-bin/ . ./apitest/ ./examples/ ./decadtest/ ./export/ ./internal/decaderr/

      # The shards download race-tests, so it holds their two binaries alone.
      - name: Upload race test binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-tests
          path: |
            race-bin/decad.test
            race-bin/apitest.test
          if-no-files-found: error
          retention-days: 1

      - name: Upload race test binaries of the other packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-tests-packages
          path: |
            race-bin/examples.test
            race-bin/decadtest.test
            race-bin/export.test
            race-bin/decaderr.test
          if-no-files-found: error
          retention-days: 1

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # Every shard runner runs its shard of both race binaries.
  test-root-race:
    name: test (${{ matrix.os }}, ${{ matrix.race }}, ${{ matrix.shard }})
    needs: [race-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: "0"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "1"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "2"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "3"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "4"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "5"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "6"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "7"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "8"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "9"
            packages: ""
          - os: ubuntu-latest
            race: "-race"
            shard: "10"
            packages: ""
    runs-on: ${{ matrix.os }}
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Timing comparisons must be made within one CPU class, so every test
      # job records its runner CPU on one greppable line.
      - name: Describe the runner CPU
        if: runner.os == 'Linux'
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          if [ -n "$model" ]; then
            echo "runner-cpu: ${model} x$(nproc)"
          else
            echo "runner-cpu: unknown"
          fi

      - name: Download race test binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: race-tests
          path: race-bin

      # Each shard regex is derived from ONE binary's own names, so it is
      # applied to that binary alone. A -run filter built from one package's
      # names matches nothing in another, so handing it ./... would run zero
      # tests in every other package while still reporting success. -run gates
      # Examples and Fuzz seed corpora as well as Test functions, so the
      # enumeration takes all three.
      #
      # Which shard a test belongs to is READ from its binary's assignment file
      # (.github/test-shards.txt for the root package,
      # .github/test-shards-apitest.txt for apitest), not computed from its
      # position in the enumeration. A positional split moves half the suite
      # between shards whenever a test is added, so a balance that held
      # yesterday is re-rolled by the next commit; the recorded assignment is
      # packed by measured cost and moves nothing when the suite grows.
      # ci_workflow_test.go and apitest/ci_shards_test.go fail when a test on
      # disk is in no shard.
      #
      # run_shard runs a binary from its package directory, as go test does,
      # so a test reading a path relative to its package finds it. Both
      # binaries run at the same time, each in a background subshell writing
      # to its own log, because each keeps only about 1.5 of the runner's
      # four cores busy. The step waits for both, prints each log whole under
      # its own group so the output is not interleaved, and fails when either
      # binary failed. A shard whose regex selects no test for a binary fails
      # in that binary's subshell, as it does when run alone.
      - name: Run race tests (Ubuntu shard)
        shell: bash
        run: |
          timeout=10m
          budget=300
          case '${{ matrix.shard }}' in
            0|10) timeout=45m; budget=2400 ;;
            1|2) budget=420 ;;
          esac
          run_shard() {
            local bin="$GITHUB_WORKSPACE/race-bin/$1" shards="$2" dir="$3"
            chmod +x "$bin"
            local tests
            tests="$("$bin" -test.list '.*' | awk -v shard='${{ matrix.shard }}' '
              NR == FNR {
                if ($0 !~ /^#/ && NF == 3) {
                  pin[$3] = $1
                }
                next
              }
              /^(Test|Fuzz|Example)/ {
                if ($0 in pin && pin[$0] == shard) {
                  printf "%s|", $0
                }
              }
            ' "$shards" -)"
            tests="${tests%|}"
            test -n "$tests"
            (cd "$dir" && "$bin" -test.timeout "$timeout" -test.run "^(${tests})$")
          }
          start=$SECONDS
          logdir="$(mktemp -d)"
          (
            run_shard decad.test .github/test-shards.txt .
          ) >"$logdir/decad.log" 2>&1 &
          decad_pid=$!
          (
            run_shard apitest.test .github/test-shards-apitest.txt apitest
          ) >"$logdir/apitest.log" 2>&1 &
          apitest_pid=$!
          decad_rc=0
          apitest_rc=0
          wait "$decad_pid" || decad_rc=$?
          wait "$apitest_pid" || apitest_rc=$?
          echo "::group::decad.test"
          cat "$logdir/decad.log"
          echo "::endgroup::"
          echo "::group::apitest.test"
          cat "$logdir/apitest.log"
          echo "::endgroup::"
          if [ "$decad_rc" -ne 0 ] || [ "$apitest_rc" -ne 0 ]; then
            echo "::error::shard ${{ matrix.shard }} failed: decad.test exit ${decad_rc}, apitest.test exit ${apitest_rc}"
            exit 1
          fi
          elapsed=$(( SECONDS - start ))
          echo "shard ${{ matrix.shard }} finished in ${elapsed}s"
          # Shard 0 holds a two-tooth bevel join. Shard 10 holds
          # the one-tooth mass regression and three-tooth bevel race slice;
          # normal CI runs all eight teeth. Both have 2400s budgets below their
          # 45m timeouts. Shards 1 and 2 carry other costly tests
          # and allow 420s; all other shards retain 300s.
          # A budget failure reports test-cost drift before a timeout does.
          # Re-measure and regenerate with the command in _shardgen/main.go.
          if [ "$elapsed" -gt "$budget" ]; then
            echo "::error::shard ${{ matrix.shard }} took ${elapsed}s, over the ${budget}s budget; re-measure and regenerate .github/test-shards.txt and .github/test-shards-apitest.txt (see _shardgen/main.go)"
            exit 1
          fi

  # The packages outside the root run on two Ubuntu runners. The main-only
  # platform job below runs the whole suite on macOS and Windows.
  #
  # ./dynamics/ has a runner of its own. Its top-level tests call t.Parallel(),
  # so they run concurrently, and their time under -race depends on the
  # hardware the job lands on: the same tests take about twice as long on the
  # slowest ubuntu-latest runners as on the fastest. The 30m -timeout covers
  # the slowest runner with room for more scenes. The 600s soft budget
  # (`budget:`) sits far below it, so growth in the scenes is reported long
  # before the timeout would fail the job.
  test:
    needs: [race-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "-race"
            shard: ""
            packages: "./examples/ ./decadtest/ ./export/ ./internal/..."
            timeout: "10m"
          - os: ubuntu-latest
            race: "-race"
            shard: ""
            packages: "./dynamics/"
            timeout: "30m"
            budget: "600"
    runs-on: ${{ matrix.os }}
    env:
      GORACE: atexit_sleep_ms=0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Timing comparisons must be made within one CPU class, so every test
      # job records its runner CPU on one greppable line.
      - name: Describe the runner CPU
        if: runner.os == 'Linux'
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          if [ -n "$model" ]; then
            echo "runner-cpu: ${model} x$(nproc)"
          else
            echo "runner-cpu: unknown"
          fi

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Both runners compile the root package, which changes in nearly every
      # pull request, so their keys cover go.mod and go.sum alone. The cache
      # name comes from the existing matrix fields.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: race-${{ matrix.packages == './dynamics/' && 'dynamics' || 'packages' }}

      - name: Download dependencies
        run: go mod download

      - name: Download race test binaries of the other packages
        if: startsWith(matrix.packages, './examples/')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: race-tests-packages
          path: race-bin

      # Every package outside the root, apart from apitest/, runs UNFILTERED on
      # one runner, so these runners and the race shards together cover what an
      # unsharded `go test ./...` covers. `./internal/...` includes new internal
      # packages automatically. ci_workflow_test.go fails when a package on disk
      # is named by no runner.
      # Dynamics builds its race binary separately so compilation and test
      # execution each stay below one minute. The binary runs from its package
      # directory, as go test would, and the soft budget still includes build.
      - name: Build dynamics race test binary
        if: matrix.packages == './dynamics/'
        shell: bash
        run: |
          date +%s > dynamics-start.txt
          go test -c -race -o dynamics.test ./dynamics/

      - name: Run dynamics race tests
        if: matrix.packages == './dynamics/'
        shell: bash
        run: |
          (cd dynamics && ../dynamics.test -test.count=1 -test.v -test.timeout '${{ matrix.timeout }}')
          elapsed=$(( $(date +%s) - $(cat dynamics-start.txt) ))
          echo "./dynamics/ finished in ${elapsed}s"
          budget='${{ matrix.budget }}'
          if [ -n "$budget" ] && [ "$elapsed" -gt "$budget" ]; then
            echo "::error::./dynamics/ took ${elapsed}s, over the ${budget}s budget; find the tests that grew in the -v durations above"
            exit 1
          fi

      # -v prints each test's duration, so a slow run shows which tests grew.
      # A runner with a `budget:` fails once the run takes longer than that
      # many seconds, far below its -timeout; see the comment above the matrix.
      # The restored build cache also holds test results, and go test replays
      # a stored result instead of running the test when nothing it depends on
      # changed. -count=1 makes every test run, so the cache saves compile
      # time only.
      #
      # The four packages whose tests import the root package run from the
      # binaries race-binary built, one after another in the background while
      # go test runs the rest. Each binary runs from its package directory, as
      # go test does, with the same -race build, -count=1, -v and timeout. The
      # rest is the operand list minus those four and minus the packages in
      # `norace`, so a new internal package still runs here, and go test
      # compiles the root package only if one of them imports it.
      #
      # `norace` runs without -race, in a go test of its own after the four
      # binaries, with the same -count, -v and timeout. Those packages' tests
      # call t.Parallel nowhere and start no goroutine, and no library code
      # they reach starts one, so the race detector has nothing to observe in
      # them. A package that gains concurrent tests or code must leave this
      # list. The step waits for both and fails when either failed.
      - name: Run tests outside the root package (Ubuntu shard)
        if: matrix.packages != '' && matrix.packages != './dynamics/'
        shell: bash
        run: |
          start=$SECONDS
          mod="$(go list -m)"
          norace_re="${mod}/internal/(loftface|polynomial|linkagebound)"
          norace="$(go list ${{ matrix.packages }} | grep -x -E "$norace_re")"
          rest="$(go list ${{ matrix.packages }} | grep -v -x -E "${mod}/(examples|decadtest|export|internal/decaderr)|$norace_re")"
          logdir="$(mktemp -d)"
          (
            rc=0
            for dir in examples decadtest export internal/decaderr; do
              bin="$GITHUB_WORKSPACE/race-bin/$(basename "$dir").test"
              chmod +x "$bin"
              echo "=== $dir"
              (cd "$dir" && "$bin" -test.count=1 -test.v -test.timeout ${{ matrix.timeout }}) || rc=1
            done
            echo "=== without -race: $(echo $norace)"
            go test -count=1 -v -timeout ${{ matrix.timeout }} $norace || rc=1
            exit "$rc"
          ) >"$logdir/prebuilt.log" 2>&1 &
          prebuilt_pid=$!
          rest_rc=0
          prebuilt_rc=0
          go test ${{ matrix.race }} -count=1 -v -timeout ${{ matrix.timeout }} $rest || rest_rc=$?
          wait "$prebuilt_pid" || prebuilt_rc=$?
          echo "::group::prebuilt race test binaries"
          cat "$logdir/prebuilt.log"
          echo "::endgroup::"
          if [ "$rest_rc" -ne 0 ] || [ "$prebuilt_rc" -ne 0 ]; then
            echo "::error::${{ matrix.packages }} failed: go test exit ${rest_rc}, prebuilt binaries exit ${prebuilt_rc}"
            exit 1
          fi
          elapsed=$(( SECONDS - start ))
          echo "${{ matrix.packages }} finished in ${elapsed}s"
          budget='${{ matrix.budget }}'
          if [ -n "$budget" ] && [ "$elapsed" -gt "$budget" ]; then
            echo "::error::${{ matrix.packages }} took ${elapsed}s, over the ${budget}s budget; find the tests that grew in the -v durations above"
            exit 1
          fi

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # The platform check names match the former macOS and Windows matrix legs.
  test-platforms:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    needs: [race-binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            race: ""
            shard: ""
            packages: ""
          - os: windows-latest
            race: ""
            shard: ""
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      # The whole-suite runner has no shard or package operand. Check both so
      # a future matrix change cannot make it repeat the Linux package tests.
      - name: Run tests
        if: matrix.shard == '' && matrix.packages == ''
        run: go test ${{ matrix.race }} -timeout 30m ./...

  # Verify the tree is tidy.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # _gallery is its own module, so no ./... above reaches it. Its go.mod
  # replaces decad with this checkout, so a root change that breaks the README
  # renderer or the landing clip fails here.
  gallery:
    name: gallery (README images and landing clip)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _gallery
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Timing comparisons must be made within one CPU class, so every test
      # job records its runner CPU on one greppable line.
      - name: Describe the runner CPU
        if: runner.os == 'Linux'
        run: |
          model=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          if [ -n "$model" ]; then
            echo "runner-cpu: ${model} x$(nproc)"
          else
            echo "runner-cpu: unknown"
          fi

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: _gallery/go.mod
          cache: false

      # setup-go's cache would key this job on _gallery/go.sum alone, so its
      # one entry would keep the decad packages as they were when that file
      # last changed. The sources are every package the gallery compiles:
      # the root package, dynamics/, internal/ and _gallery/ itself. The
      # restore action runs from the repository root, so the paths start
      # there.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: gallery
          sources: |
            :(glob)**/*.go
            :(exclude)apitest
            :(exclude)decadtest
            :(exclude)examples
            :(exclude)export
            :(exclude)_shardgen
            _gallery/go.mod
            _gallery/go.sum

      - name: Tidy dependencies
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # These commands run in _gallery, not over the root suite the shard jobs
      # own.
      # The tumble scene's 768 steps and the parts-bin scene's 1024 take
      # about six and four minutes on a fast machine, together past go test's
      # default ten-minute budget, and about twice that on a slow runner.
      # The scenes' tests run in parallel, one timeline per core, so the
      # step takes about as long as the slowest scene.
      - name: Vet and test
        run: |
          go vet ./...
          go test -timeout 45m ./...

      # -smoke renders the first frame of every shot. -probe builds and
      # tessellates the bodies of every frame, so it also catches decad
      # refusing a value partway through a parameter ramp.
      #
      # The dynamics subcommand runs one scene, stack-and-drop, the shortest.
      # Its path through flag parsing, the scene map, the clip and the PNG
      # sequence is the same for every scene. The tests above advance every
      # scene's whole timeline once, built through the same scene map, and
      # render its first frame at the smoke size, so a smoke render of the
      # tumble or parts-bin scene would advance its timeline a second time
      # and check nothing more.
      - name: Smoke-render hero and dynamics scenes and probe the landing clip
        run: |
          go run . hero -smoke -out "$RUNNER_TEMP/hero"
          go run . clip -smoke -out "$RUNNER_TEMP/frames"
          go run . clip -probe
          go run . dynamics -scene stack-and-drop -smoke -out "$RUNNER_TEMP/dynamics"

      - name: Render the complete thread example
        run: go run . -only thread -scale 0.125 -out "$RUNNER_TEMP/thread"

      - name: Save Go build cache
        uses: ./.github/actions/go-build-cache-save

  # Scan the module and its dependencies for known vulnerabilities.
  govulncheck:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      GOVULNCHECK_VERSION: v1.4.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The cache name carries the govulncheck version, so a version bump saves
      # a snapshot holding the new build of the tool.
      - name: Restore Go build cache
        uses: ./.github/actions/go-build-cache-restore
        with:
          name: govulncheck-${{ env.GOVULNCHECK_VERSION }}

      # govulncheck requires a newer Go than this module's `go` directive, but
      # setup-go pins GOTOOLCHAIN=local. Allow an on-demand toolchain fetch so
      # the tool builds; it still analyzes this module as authored.
      - name: Run govulncheck
        env:
          GOTOOLCHAIN: auto
