name: Docs

# Regenerates docs/reference once a day and commits any change straight to
# the default branch. It does not run on pushes or pull requests. The push uses
# a GitHub App token, so the workflow's own token stays read-only.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reference:
    name: regenerate reference
    runs-on: ubuntu-latest
    # The environment holds the app key and only lets main read it, so a job on
    # any other branch cannot push past the pull request rule.
    environment: docs
    steps:
      # The default GITHUB_TOKEN cannot bypass the pull request rule. The app can.
      - name: Create app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      # pkg.go.dev cannot host this module (non-OSS license), so the package
      # reference is generated into docs/reference and committed.
      - name: Regenerate reference
        uses: lestrrat/go-docgen-action@cd384ad06ee7726117db19ad079d8afe9a6fdfa2 # main
        with:
          version: e1a899b8c7ec5a1494be07caf2338086fd99bcc9 # lestrrat-go/docgen main
          out: docs/reference
          commit: "true"
