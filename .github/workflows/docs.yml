name: Docs

# Regenerates docs/reference once a day and commits any change straight to
# the default branch. It does not run on pushes or pull requests, so the write
# permission below is never held by a job a pull request can influence.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  reference:
    name: regenerate reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pkg.go.dev cannot host this module (non-OSS license), so the package
      # reference is generated into docs/reference and committed.
      - name: Regenerate reference
        uses: lestrrat/go-docgen-action@cd384ad06ee7726117db19ad079d8afe9a6fdfa2 # main
        with:
          version: e1a899b8c7ec5a1494be07caf2338086fd99bcc9 # lestrrat-go/docgen main
          out: docs/reference
          commit: "true"
