name: Focused Go test

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed canary controls commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: decad-refactor-canaries
  cancel-in-progress: false
jobs:
  canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dispatched controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run only approved live canaries
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/test-20261016-refactor-canaries-reviewed
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          python3 -B .validation/hosted_canaries.py --manifest-sha256 3d995e9c1468a031e585a4dc796c60630db643af6ec5e758b73c4df9859a6080
      - name: Preserve canary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refactor-canaries-${{ github.run_id }}
          path: ${{ runner.temp }}/decad-h4-canary-*/artifacts/
          if-no-files-found: error
          retention-days: 1
