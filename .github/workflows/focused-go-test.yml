name: Focused Go test

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character Decad commit SHA
        required: true
        type: string
      test_name:
        description: One root-package test name
        required: true
        type: string

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: golang:1.27.3-bookworm
      options: --memory=4g --memory-swap=4g
    steps:
      - name: Validate inputs
        shell: bash
        env:
          DECAD_COMMIT: ${{ inputs.commit }}
          TEST_NAME: ${{ inputs.test_name }}
        run: |
          [[ "$DECAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TEST_NAME" =~ ^Test[A-Za-z0-9_]+$ ]]

      - name: Check out Decad commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Require named root-package test
        shell: bash
        env:
          TEST_NAME: ${{ inputs.test_name }}
        run: |
          go test -list "^${TEST_NAME}$" . > "$RUNNER_TEMP/focused-go-test-list.txt"
          grep -Fqx "$TEST_NAME" "$RUNNER_TEMP/focused-go-test-list.txt"

      - name: Run named root-package test
        shell: bash
        env:
          TEST_NAME: ${{ inputs.test_name }}
        run: |
          go test -json -count=1 -timeout 8m -run "^${TEST_NAME}$" . |
            tee "$RUNNER_TEMP/focused-go-test.json"
          ! grep -Fq '"Action":"skip"' "$RUNNER_TEMP/focused-go-test.json"
          grep -F '"Action":"pass"' "$RUNNER_TEMP/focused-go-test.json" |
            grep -Fq "\"Test\":\"${TEST_NAME}\""
