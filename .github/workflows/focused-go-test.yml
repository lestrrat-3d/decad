name: Focused Go test
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed section controls commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: decad-refactor-section
  cancel-in-progress: false
jobs:
  section:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Run approved section validation
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/test-20261016-section-recovery-reviewed
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          python3 -B .validation/validation_controller.py --source "$GITHUB_WORKSPACE" --plan section --manifest-sha256 9b94eb2e8853e98b254441f0c61e8a27ed3f9e2f76a816673638db29a2dd4ec9
      - name: Preserve section evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: refactor-section-${{ github.run_id }}
          path: ${{ runner.temp }}/decad-h4-*/artifacts/
          if-no-files-found: error
          retention-days: 1
