name: Focused Go test

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact temporary facet owner measurement commit SHA
        required: true
        type: string

      phase:
        description: Reviewed serial measurement phase
        required: true
        type: choice
        options: [census, primary, cold, gc, helper, helper_0, helper_8191, helper_rods, helper_washer, heap_consumer, heap_1, heap_2, heap_4, heap_8, cancel]

permissions:
  contents: read

jobs:
  facet-owner-measurement-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Check out the exact temporary commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 3
          persist-credentials: false

      - name: Run bounded facet owner measurement validation
        env:
          VALIDATION_PHASE: ${{ inputs.phase }}
          DECAD_SOURCE_SHA: ${{ inputs.commit }}
          DECAD_DISPATCH_SHA: ${{ github.sha }}
          DECAD_DISPATCH_REF: ${{ github.ref }}
          DECAD_WORKFLOW_SHA: ${{ github.workflow_sha }}
          DECAD_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 .validation/run_hosted.py

      - name: Preserve bounded validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: facet-owner-measurement-${{ github.run_id }}
          path: ${{ runner.temp }}/decad-facet-owner-measurement-*/artifacts/
          if-no-files-found: error
          retention-days: 1
