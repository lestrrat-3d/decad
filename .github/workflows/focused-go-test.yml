name: Focused Go test

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed temporary thread validation commit
        required: true
        type: string
      validation:
        description: Reporting-only clipped-volume diagnostic
        required: true
        type: choice
        options:
          - diagnostic
permissions:
  contents: read
concurrency:
  group: decad-thread-gallery-validation
  cancel-in-progress: false
jobs:
  thread-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 2
          persist-credentials: false
      - name: Run reviewed bounded validation
        env:
          DECAD_VALIDATION: ${{ inputs.validation }}
          DECAD_SOURCE_SHA: ${{ inputs.commit }}
          DECAD_DISPATCH_SHA: ${{ github.sha }}
          DECAD_DISPATCH_REF: ${{ github.ref }}
          DECAD_WORKFLOW_SHA: ${{ github.workflow_sha }}
          DECAD_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: python3 .validation/run_hosted.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thread-gallery-${{ inputs.validation }}-${{ github.run_id }}
          path: ${{ runner.temp }}/decad-thread-gallery-*/artifacts/
          if-no-files-found: error
          retention-days: 1
