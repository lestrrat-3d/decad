# The lestrrat-go house config: `default: all` with a curated disable list.
version: "2"
linters:
  default: all
  disable:
    - copyloopvar
    - cyclop
    - depguard
    - embeddedstructfieldcheck
    - err113
    - errorlint
    - exhaustive
    # exhaustruct flags every partially-initialized struct literal.
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomodguard
    - gosec
    - gosmopolitan
    - iface
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - makezero
    - mnd
    - nakedret
    - nestif
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - recvcheck
    - revive
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    forbidigo:
      # analyze-types matches a method by its type, so the pattern below names
      # (*big.Rat).Add and its siblings whatever the receiver is called.
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^big\.Rat\.(Add|Sub|Mul|Quo|Cmp)$
          msg: raw big.Rat arithmetic; use proof.AddRat, SubRat, MulRat, QuoRat or CmpRat
    goconst:
      min-occurrences: 5
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
      settings:
        # Replaces the analyzer's default list, so it carries the standard-library
        # defaults too. Every constructor of an operation command is listed, so that
        # a statement such as decad.Union(a, b) with no Do fails lint
        # (agent-docs/command-api-design.md §10). The standard-library entries are
        # copied from the default list of golang.org/x/tools v0.52.0
        # (passes/unusedresult), the version inside golangci-lint v2.15.0. A
        # golangci-lint bump re-copies them.
        unusedresult:
          funcs:
            - context.WithCancel
            - context.WithDeadline
            - context.WithTimeout
            - context.WithValue
            - errors.New
            - fmt.Append
            - fmt.Appendf
            - fmt.Appendln
            - fmt.Errorf
            - fmt.Sprint
            - fmt.Sprintf
            - fmt.Sprintln
            - maps.All
            - maps.Clone
            - maps.Collect
            - maps.Equal
            - maps.EqualFunc
            - maps.Keys
            - maps.Values
            - slices.All
            - slices.AppendSeq
            - slices.Backward
            - slices.BinarySearch
            - slices.BinarySearchFunc
            - slices.Chunk
            - slices.Clip
            - slices.Clone
            - slices.Collect
            - slices.Compact
            - slices.CompactFunc
            - slices.Compare
            - slices.CompareFunc
            - slices.Concat
            - slices.Contains
            - slices.ContainsFunc
            - slices.Delete
            - slices.DeleteFunc
            - slices.Equal
            - slices.EqualFunc
            - slices.Grow
            - slices.Index
            - slices.IndexFunc
            - slices.Insert
            - slices.IsSorted
            - slices.IsSortedFunc
            - slices.Max
            - slices.MaxFunc
            - slices.Min
            - slices.MinFunc
            - slices.Repeat
            - slices.Replace
            - slices.Sorted
            - slices.SortedFunc
            - slices.SortedStableFunc
            - slices.Values
            - sort.Reverse
            - github.com/lestrrat-3d/decad.Union
            - github.com/lestrrat-3d/decad.Cut
            - github.com/lestrrat-3d/decad.Intersect
            - github.com/lestrrat-3d/decad.Refine
            - github.com/lestrrat-3d/decad.Fillet
            - github.com/lestrrat-3d/decad.Chamfer
            - github.com/lestrrat-3d/decad.FilletChord
            - github.com/lestrrat-3d/decad.ChamferAngle
            - github.com/lestrrat-3d/decad.Shell
            - github.com/lestrrat-3d/decad.ShellClosed
            - github.com/lestrrat-3d/decad.Draft
            - github.com/lestrrat-3d/decad.Offset
            - github.com/lestrrat-3d/decad.Thicken
            - github.com/lestrrat-3d/decad.MoveFace
            - github.com/lestrrat-3d/decad.ConeFromFace
            - github.com/lestrrat-3d/decad.Extrude
            - github.com/lestrrat-3d/decad.Revolve
            - github.com/lestrrat-3d/decad.Sweep
            - github.com/lestrrat-3d/decad.Coil
            - github.com/lestrrat-3d/decad.Loft
            - github.com/lestrrat-3d/decad.LoftChain
            - github.com/lestrrat-3d/decad.LoftFromPoint
            - github.com/lestrrat-3d/decad.LoftSections
            - github.com/lestrrat-3d/decad.LoftFaces
            - github.com/lestrrat-3d/decad.LoftFacesToCone
            - github.com/lestrrat-3d/decad.PatchProfile
            - github.com/lestrrat-3d/decad.Emboss
            - github.com/lestrrat-3d/decad.WebPath
            - github.com/lestrrat-3d/decad.CutExtrude
            - github.com/lestrrat-3d/decad.CutRevolve
            - github.com/lestrrat-3d/decad.Transform
            - github.com/lestrrat-3d/decad.Copy
            - github.com/lestrrat-3d/decad.Mirrored
            - github.com/lestrrat-3d/decad.MirroredJoin
            - github.com/lestrrat-3d/decad.MirroredCopy
            - github.com/lestrrat-3d/decad.ScaledAt
            - github.com/lestrrat-3d/decad.QuarterTurn
            - github.com/lestrrat-3d/decad.Stretch
            - github.com/lestrrat-3d/decad.PatternCopies
            - github.com/lestrrat-3d/decad.Patterned
            - github.com/lestrrat-3d/decad.PathPattern
            - github.com/lestrrat-3d/decad.Arrange
            - github.com/lestrrat-3d/decad.Hole
            - github.com/lestrrat-3d/decad.HoleShaped
            - github.com/lestrrat-3d/decad.Boss
            - github.com/lestrrat-3d/decad.BossShaped
            - github.com/lestrrat-3d/decad.Thread
            - github.com/lestrrat-3d/decad.Infill
            - github.com/lestrrat-3d/decad.SheetMetal
            - github.com/lestrrat-3d/decad.PatchEdges
            - github.com/lestrrat-3d/decad.Stitch
            - github.com/lestrrat-3d/decad.Unstitch
            - github.com/lestrrat-3d/decad.Trim
            - github.com/lestrrat-3d/decad.Extend
            - github.com/lestrrat-3d/decad.Split
            - github.com/lestrrat-3d/decad.SolidFromMesh
            - github.com/lestrrat-3d/decad.Remove
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Examples repeat setup to explain each operation in place.
      - linters:
          - dupl
        path: (^|/)examples/.*_test\.go$
      - linters:
          - staticcheck
        text: 'ST1003: should not use underscores in package names'
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - errcheck
        path: /main.go
      - linters:
          - errcheck
          - errchkjson
          - forcetypeassert
        path: /*_test.go
      - linters:
          - forbidigo
        path: (^|/)cmd/
      # The print ban never applied under internal/.
      - linters:
          - forbidigo
        path: (^|/)internal/
        text: forbidden by pattern
      # The big.Rat ban applies to exactly the files whose raw Rat calls are
      # all migrated to internal/proof. Add a file here when it joins them.
      - linters:
          - forbidigo
        text: raw big.Rat arithmetic
        path-except: ^internal/(loftcylinder/ring_edge_records|loftmesh/loft_cap_proof|loftmesh/loft_moments|massmoment/prism_frame|massmoment/tensor|meshbool/boolean|momentregion/state|motionbound/interval_matrix|proofbound/area_slack|proofbound/axis_interval|proofbound/bounds|proofbound/frame_box|proofbound/interval_arithmetic|proofbound/interval_trig|proofbound/log|proofbound/rat_interval|proofbound/rational|proofbound/turn_trig|revolvemesh/tessellate_revolve_volume|shellseparation/shell)\.go$
      - linters:
          - forbidigo
          - errcheck
        path: /*_test.go
      - linters:
          - godoclint
        path: (^|/)internal/
    paths:
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
