# The lestrrat-go house config: `default: all` with a curated disable list.
version: "2"
linters:
  default: all
  disable:
    - copyloopvar
    - cyclop
    - depguard
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errorlint
    - exhaustive
    # exhaustruct flags every partially-initialized struct literal.
    - exhaustruct
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomodguard
    - gosec
    - gosmopolitan
    - iface
    - inamedparam
    - interfacebloat
    - ireturn
    - lll
    - maintidx
    - makezero
    - mnd
    - nakedret
    - nestif
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - prealloc
    - recvcheck
    - revive
    - tagliatelle
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - varnamelen
    - wastedassign
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    forbidigo:
      # analyze-types matches a method by its type, so the pattern below names
      # (*big.Rat).Add and its siblings whatever the receiver is called.
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
        - pattern: ^big\.Rat\.(Add|Sub|Mul|Quo|Cmp)$
          msg: raw big.Rat arithmetic; use proof.AddRat, SubRat, MulRat, QuoRat or CmpRat
    goconst:
      min-occurrences: 5
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - staticcheck
        text: 'ST1003: should not use underscores in package names'
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - errcheck
        path: /main.go
      - linters:
          - errcheck
          - errchkjson
          - forcetypeassert
        path: /*_test.go
      - linters:
          - forbidigo
        path: (^|/)cmd/
      # The print ban never applied under internal/.
      - linters:
          - forbidigo
        path: (^|/)internal/
        text: forbidden by pattern
      # The big.Rat ban applies to non-test files of these packages and
      # files only, where every raw Rat call is migrated to internal/proof.
      - linters:
          - forbidigo
        text: raw big.Rat arithmetic
        path-except: ^internal/(proofbound/|shellseparation/shell\.go$|massmoment/(tensor|prism_frame)\.go$|loftcylinder/ring_edge_records\.go$|momentregion/state\.go$|motionbound/interval_matrix\.go$|revolvemesh/tessellate_revolve_volume\.go$)
      - linters:
          - forbidigo
          - errcheck
        path: /*_test.go
      - linters:
          - godoclint
        path: (^|/)internal/
    paths:
      - third_party$
      - builtin$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
